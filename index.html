<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    :root{
      --bg:#F2EDD7;--surface:#FFFEF5;--red:#CC0000;--navy:#003580;
      --gold:#C8952A;--gold-lt:#F5D07A;--text:#1A1A1A;--muted:#888;--border:#1A1A1A;
    }
    html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px}
    .screen{display:none;flex-direction:column;height:100%;overflow:hidden}
    .screen.active{display:flex}

    /* ── SETUP ── */
    #setup{padding:32px 20px 36px;overflow-y:auto;gap:14px;align-items:stretch;background:var(--bg)}
    .setup-logo{font-family:'Alfa Slab One',serif;font-size:78px;line-height:0.84;text-align:center;color:var(--red);text-shadow:4px 4px 0 rgba(0,0,0,0.13);letter-spacing:1px}
    .setup-sub{text-align:center;color:var(--navy);font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:3.5px;text-transform:uppercase;font-weight:700;margin-top:6px}
    .setup-rule{height:3px;background:var(--border);border-radius:2px;margin:2px 0}
    .players-list{display:flex;flex-direction:column;gap:8px;margin-top:2px}
    .player-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:2.5px solid var(--border);border-radius:12px;padding:10px 14px;transition:border-color .2s}
    .player-row:focus-within{border-color:var(--red)}
    .player-swatch{width:32px;height:32px;border-radius:50%;flex-shrink:0;border:2.5px solid var(--border)}
    .player-row input{flex:1;background:transparent;border:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;outline:none}
    .player-row input::placeholder{color:var(--muted);font-weight:400}
    .remove-btn{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 6px;line-height:1;flex-shrink:0}
    .add-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:2px dashed #999;border-radius:12px;color:var(--muted);font-family:'Oswald',sans-serif;font-weight:700;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;padding:13px;cursor:pointer;width:100%;transition:all .2s}
    .add-btn:active{color:var(--navy);border-color:var(--navy)}
    .start-btn{background:var(--red);border:3px solid var(--border);border-radius:12px;color:#fff;font-family:'Alfa Slab One',serif;font-size:22px;letter-spacing:3px;padding:15px;cursor:pointer;box-shadow:4px 4px 0 var(--border);transition:transform .1s,box-shadow .1s;text-transform:uppercase;margin-top:4px}
    .start-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--border)}
    .start-btn:disabled{opacity:.38;cursor:default}

    /* ── GAME HEADER ── */
    .game-header{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:var(--surface);border-bottom:3px solid var(--border);flex-shrink:0}
    .round-label{font-family:'Alfa Slab One',serif;font-size:22px;letter-spacing:2px;color:var(--red);line-height:1}
    .direction-label{font-family:'Oswald',sans-serif;font-size:10px;color:var(--navy);letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-top:2px}
    .header-btns{display:flex;gap:8px;align-items:center}
    .icon-btn{background:none;border:2px solid transparent;color:var(--text);font-size:20px;cursor:pointer;padding:5px 7px;line-height:1;border-radius:8px;transition:all .15s}
    .icon-btn:active{border-color:var(--border);background:rgba(0,0,0,.07)}

    /* ── PLAYER STRIP ── */
    .player-strip{display:flex;gap:6px;padding:9px 14px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;border-bottom:2px solid rgba(26,26,26,.1);background:var(--bg)}
    .player-strip::-webkit-scrollbar{display:none}
    .p-chip{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px;max-width:54px;cursor:pointer;flex-shrink:0;padding:4px;border-radius:10px}
    .p-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Alfa Slab One',serif;font-size:16px;color:#fff;border:2.5px solid var(--border);transition:all .25s;opacity:.38;position:relative}
    .p-avatar.active{opacity:1;box-shadow:0 0 0 2.5px var(--bg),0 0 0 5px var(--border);transform:scale(1.12)}
    .p-avatar.miss-flag::after{content:'SKIP';position:absolute;top:-9px;right:-22px;font-size:7px;background:var(--red);color:#fff;border-radius:4px;padding:1px 4px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.5px;border:1.5px solid var(--border)}
    .p-name{font-family:'Oswald',sans-serif;font-size:9px;color:var(--muted);text-align:center;max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
    .p-name.active{color:var(--text)}

    /* ── CARD AREA ── */
    .card-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:14px;background:var(--bg);overflow:hidden}
    .turn-label{font-size:13px;color:var(--muted);text-align:center;min-height:20px;font-weight:500}
    .turn-label strong{color:var(--text);font-weight:700}

    /* ── CARD FLIP ── */
    .card-wrap{width:238px;height:354px;perspective:1000px;cursor:pointer;flex-shrink:0}
    .card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.35,0,.15,1)}
    .card-inner.flipped{transform:rotateY(180deg)}
    .card-inner.no-anim{transition:none!important}
    .c-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden}

    /* BACK */
    .c-back{
      background:#CC0000;
      background-image:
        repeating-linear-gradient(45deg,rgba(0,0,0,.07) 0,rgba(0,0,0,.07) 1px,transparent 0,transparent 50%),
        repeating-linear-gradient(-45deg,rgba(0,0,0,.07) 0,rgba(0,0,0,.07) 1px,transparent 0,transparent 50%);
      background-size:10px 10px;
      border:3px solid var(--border);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0
    }
    .c-back-inner{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.38);border-radius:10px;padding:18px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px}
    .c-back-logo{font-family:'Alfa Slab One',serif;font-size:30px;letter-spacing:4px;color:#fff;line-height:1.1}
    .c-back-sub{font-family:'Oswald',sans-serif;font-size:9px;color:rgba(255,255,255,.6);letter-spacing:3px;text-transform:uppercase;font-weight:700}
    .c-back-hint{font-family:'Oswald',sans-serif;font-size:10px;color:rgba(255,255,255,.7);letter-spacing:3px;text-transform:uppercase;font-weight:700;animation:hint-pulse 2.2s ease-in-out infinite}

    /* FRONT base */
    .c-front{transform:rotateY(180deg);display:flex;flex-direction:column;background:var(--surface);border:2.5px solid var(--border)}

    /* Card header */
    .c-header{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 18px;position:relative;overflow:hidden}
    .c-rarity-label{font-family:'Oswald',sans-serif;font-weight:700;font-size:10px;letter-spacing:4px;text-transform:uppercase;padding:3px 10px;border-radius:20px;color:rgba(255,255,255,.85)}

    /* Card body */
    .c-body{flex:1;display:flex;flex-direction:column;padding:20px 20px 16px;gap:11px}
    .c-name{font-family:'Alfa Slab One',serif;font-size:26px;line-height:1.1;color:var(--text)}
    .c-divider-line{height:2.5px;border-radius:1.5px;width:100%;background:var(--text);flex-shrink:0}
    .c-desc{font-size:13px;color:#555;line-height:1.65}

    /* Rarity: COMMON — black header */
    .r-common .c-header{background:#1A1A1A}

    /* Rarity: UNCOMMON — navy */
    .r-uncommon .c-header{background:var(--navy)}
    .c-front.r-uncommon{border-color:var(--navy)}
    .r-uncommon .c-name{color:var(--navy)}
    .r-uncommon .c-divider-line{background:var(--navy)}

    /* Rarity: RARE — gold shimmer */
    .r-rare .c-header{background:linear-gradient(90deg,var(--gold) 0%,var(--gold-lt) 38%,var(--gold) 52%,var(--gold-lt) 72%,var(--gold) 100%);background-size:200% auto;animation:shimmer 2.4s linear infinite}
    .r-rare .c-rarity-label{color:#5C3800;background:rgba(255,255,255,.32)}
    .c-front.r-rare{border-color:var(--gold);border-width:3px}
    .r-rare .c-name{color:#5C3800}
    .r-rare .c-divider-line{background:var(--gold)}

    /* Rarity: LEGENDARY — red shimmer */
    .r-legendary .c-header{background:linear-gradient(90deg,#AA0000 0%,#CC0000 28%,#FF4444 50%,#CC0000 72%,#AA0000 100%);background-size:200% auto;animation:shimmer 1.7s linear infinite;padding:22px 18px}
    .r-legendary .c-rarity-label{color:var(--gold-lt);background:rgba(0,0,0,.22)}
    .c-front.r-legendary{border-color:var(--gold);border-width:4px}
    .r-legendary .c-name{color:var(--red)}
    .r-legendary .c-divider-line{background:var(--gold)}

    /* ── NEXT BTN ── */
    .action-area{flex-shrink:0;padding:0 16px 10px;display:flex;justify-content:center}
    .next-btn{width:100%;max-width:320px;background:var(--red);border:3px solid var(--border);border-radius:12px;color:#fff;font-family:'Alfa Slab One',serif;font-size:20px;letter-spacing:2px;padding:13px;cursor:pointer;box-shadow:4px 4px 0 var(--border);transition:opacity .2s,transform .1s,box-shadow .1s;opacity:0;pointer-events:none;text-transform:uppercase}
    .next-btn.show{opacity:1;pointer-events:all}
    .next-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--border)}

    /* ── HISTORY ── */
    .history-strip{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;flex-shrink:0;border-top:2px solid rgba(26,26,26,.1);min-height:52px;align-items:center;scrollbar-width:none;background:var(--surface)}
    .history-strip::-webkit-scrollbar{display:none}
    .h-empty{color:var(--muted);font-size:10px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:2px;text-transform:uppercase}
    .h-item{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;max-width:52px;padding:5px 6px;background:var(--bg);border:1.5px solid rgba(26,26,26,.18);border-radius:8px;flex-shrink:0}
    .h-player{font-size:8px;color:var(--muted);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
    .h-card{font-size:8px;color:var(--text);font-weight:600;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .h-dot{width:5px;height:5px;border-radius:50%;margin-top:1px;flex-shrink:0}

    /* ── CARD EDITOR ── */
    #card-editor{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;justify-content:flex-end}
    #card-editor.open{display:flex}
    .ed-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.52)}
    .ed-sheet{position:relative;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;border:3px solid var(--border);border-bottom:none;box-shadow:0 -5px 0 var(--border)}
    .ed-handle{width:36px;height:4px;background:rgba(26,26,26,.2);border-radius:2px;margin:10px auto 0}
    .ed-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 14px;border-bottom:2px solid var(--border);flex-shrink:0}
    .ed-title{font-family:'Alfa Slab One',serif;font-size:20px;letter-spacing:2px;color:var(--red)}
    .ed-close{background:none;border:2px solid var(--border);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;padding:4px 10px;border-radius:8px}
    .ed-body{overflow-y:auto;flex:1}
    .ed-section-hdr{padding:8px 20px 4px;font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--surface);z-index:1;border-bottom:1px solid rgba(26,26,26,.08)}
    .ed-row{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid rgba(26,26,26,.06)}
    .ed-card-name{flex:1;font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
    .rarity-sel{background:var(--bg);border:1.5px solid rgba(26,26,26,.25);color:var(--text);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:11px;padding:4px;cursor:pointer;max-width:90px}
    .toggle{position:relative;width:38px;height:22px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0;position:absolute}
    .tog-sl{position:absolute;inset:0;background:rgba(26,26,26,.12);border-radius:11px;cursor:pointer;transition:background .25s;border:1.5px solid rgba(26,26,26,.18)}
    .tog-sl::before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:#aaa;border-radius:50%;transition:transform .25s,background .25s}
    .toggle input:checked+.tog-sl{background:rgba(204,0,0,.15);border-color:var(--red)}
    .toggle input:checked+.tog-sl::before{transform:translateX(16px);background:var(--red)}

    @keyframes hint-pulse{0%,100%{opacity:.38}50%{opacity:.88}}
    @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup" class="screen active">
  <div class="setup-logo">DEAL<br>BONUS</div>
  <div class="setup-sub">Monopoly Deal · Companion</div>
  <div class="setup-rule"></div>
  <div class="players-list" id="players-list"></div>
  <button class="add-btn" id="add-btn">＋  ADD PLAYER</button>
  <button class="start-btn" id="start-btn" disabled="disabled">START GAME</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="game-header">
    <div>
      <div class="round-label" id="round-label">ROUND 1</div>
      <div class="direction-label" id="dir-label">▶ CLOCKWISE</div>
    </div>
    <div class="header-btns">
      <button class="icon-btn" id="mute-btn">🔊</button>
      <button class="icon-btn" id="editor-btn">⚙️</button>
    </div>
  </div>
  <div class="player-strip" id="player-strip"></div>
  <div class="card-area">
    <div class="turn-label" id="turn-label">Loading…</div>
    <div class="card-wrap" id="card-wrap">
      <div class="card-inner" id="card-inner">
        <div class="c-face c-back">
          <div class="c-back-inner">
            <div class="c-back-logo">DEAL<br>BONUS</div>
            <div class="c-back-sub">Monopoly Deal</div>
            <div class="c-back-hint">TAP TO REVEAL</div>
          </div>
        </div>
        <div class="c-face c-front" id="c-front"></div>
      </div>
    </div>
  </div>
  <div class="action-area">
    <button class="next-btn" id="next-btn">NEXT PLAYER →</button>
  </div>
  <div class="history-strip" id="history-strip">
    <span class="h-empty">NO CARDS DRAWN YET</span>
  </div>
</div>

<!-- CARD EDITOR -->
<div id="card-editor">
  <div class="ed-backdrop" id="ed-backdrop"></div>
  <div class="ed-sheet">
    <div class="ed-handle"></div>
    <div class="ed-header">
      <div class="ed-title">CARD EDITOR</div>
      <button class="ed-close" id="ed-close">✕</button>
    </div>
    <div class="ed-body" id="ed-body"></div>
  </div>
</div>

<canvas id="pcvs" style="position:fixed;inset:0;pointer-events:none;z-index:200;display:none"></canvas>
<script>
class Component {
  constructor() {
    this.CARDS = [
      {id:1,name:'Extra Draw',rarity:'common',enabled:true,desc:'Draw 1 extra card before your normal 2.'},
      {id:2,name:'Four Play',rarity:'common',enabled:true,desc:'Play 4 cards instead of 3 this turn.'},
      {id:3,name:'No Block',rarity:'common',enabled:true,desc:'Your rent cards cannot be blocked with Just Say No this turn.'},
      {id:4,name:'Draw and Discard',rarity:'common',enabled:true,desc:'Draw 3 cards before your normal 2, then discard 1.'},
      {id:5,name:'Impression',rarity:'common',enabled:true,desc:'Do an impression of another player. They decide if it was good enough. If yes, draw 1 extra card.'},
      {id:6,name:'Silence',rarity:'common',enabled:true,desc:'You cannot speak for the rest of this round. If you do, skip your next turn.'},
      {id:7,name:'High Five',rarity:'common',enabled:true,desc:'High five every other player before drawing your cards. If anyone refuses, they skip their next turn.'},
      {id:8,name:"Dealer's Choice",rarity:'common',enabled:true,desc:'The player to your right draws your 2 cards for you and hands them over.'},
      {id:9,name:'Take From the Rich',rarity:'common',enabled:true,desc:'The player with the most money cards must give you 1.'},
      {id:10,name:'Favourite Colour',rarity:'common',enabled:true,desc:'Announce your favourite property colour. Carry on regardless.'},
      {id:11,name:'Fresh Hand',rarity:'uncommon',enabled:true,desc:'Swap your entire hand with the top 5 cards from the draw pile.'},
      {id:12,name:'Peek',rarity:'uncommon',enabled:true,desc:'Choose a player. They must show you their full hand.'},
      {id:13,name:'Pickpocket',rarity:'uncommon',enabled:true,desc:'Steal one money card from any other player.'},
      {id:14,name:'Protected',rarity:'uncommon',enabled:true,desc:'Your properties cannot be stolen this turn, except to pay a debt.'},
      {id:15,name:'Reverse',rarity:'uncommon',enabled:true,desc:'Reverse the direction of play from this turn onwards.',effect:'reverse'},
      {id:16,name:'Sit Out',rarity:'uncommon',enabled:true,desc:'Miss your turn, but draw 4 cards as compensation.'},
      {id:17,name:'Question Mode',rarity:'uncommon',enabled:true,desc:'Speak only in questions until your next turn. Any slip-up and another player can make you discard 1 card.'},
      {id:18,name:'Hand Swap',rarity:'rare',enabled:true,desc:'Swap your entire hand with any player of your choice.'},
      {id:19,name:'Bank Swap',rarity:'rare',enabled:true,desc:'Swap your money bank with any other player\'s bank.'},
      {id:20,name:'Board Swap',rarity:'rare',enabled:true,desc:'Swap your entire property board with any other player\'s.'},
      {id:21,name:'Blind Steal',rarity:'rare',enabled:true,desc:'Take any one card from any player\'s hand at random (they fan their cards face down).'},
      {id:22,name:'Double Rent',rarity:'rare',enabled:true,desc:'Any rent you charge this turn is doubled.'},
      {id:23,name:'Stack the Deck',rarity:'rare',enabled:true,desc:'Look at the top 5 cards of the draw pile and rearrange them in any order.'},
      {id:24,name:'Open Book',rarity:'rare',enabled:true,desc:'Show the next player your hand before they draw. They must keep that information to themselves.'},
      {id:25,name:'Deal Breaker',rarity:'legendary',enabled:true,desc:'Steal a complete property set from any player, as if you played a Deal Breaker card.'},
      {id:26,name:'Double Turn',rarity:'legendary',enabled:true,desc:'Take an extra full turn immediately after this one.',effect:'double_turn'},
      {id:27,name:'Untouchable',rarity:'legendary',enabled:true,desc:'All rent charges against you are void until your next turn.'},
      {id:28,name:'Purge',rarity:'legendary',enabled:true,desc:'Force any one player to discard down to 3 cards. They choose which to keep.'},
      {id:29,name:'Pass It On',rarity:'legendary',enabled:true,desc:'Everyone passes their entire hand to the left simultaneously.'},
      {id:30,name:'Accent Round',rarity:'common',enabled:true,desc:'Speak in a silly accent until your next turn. Drop it and you discard 1 card.'},
      {id:31,name:'One Hand',rarity:'common',enabled:true,desc:'Play your entire next turn using only one hand.'},
      {id:32,name:'Stand Up',rarity:'common',enabled:true,desc:'You must stand for the rest of the round. Sit down and skip your next turn.'},
      {id:33,name:'No Names',rarity:'common',enabled:true,desc:'Nobody may say your name until your next turn. Anyone who slips gives you a card.'},
      {id:34,name:'Compliment',rarity:'common',enabled:true,desc:'Give a genuine compliment to the player on your left, then draw normally.'},
      {id:35,name:'Sound Effect',rarity:'common',enabled:true,desc:'Make a sound effect every time you play a card this turn.'},
      {id:36,name:'Whisper',rarity:'common',enabled:true,desc:'Speak only in a whisper until your next turn.'},
      {id:37,name:'Best Friend',rarity:'common',enabled:true,desc:'Pick a player to be your best friend this round. Refer to them only as that.'},
      {id:38,name:'Trade Seats',rarity:'common',enabled:true,desc:'Swap seats with any other player. Hands and boards stay put.'},
      {id:39,name:'Dance Break',rarity:'common',enabled:true,desc:'Do a five second dance before drawing. No dance, no draw.'},
      {id:40,name:'Group Cheers',rarity:'common',enabled:true,desc:'Everyone raises a glass (or imaginary one) and cheers you. Then carry on.'},
      {id:41,name:'Tongue Twister',rarity:'common',enabled:true,desc:'Say "red lorry, yellow lorry" three times fast. Fail and skip a card play.'},
      {id:42,name:'Poker Face',rarity:'common',enabled:true,desc:'No smiling or laughing until your next turn. Crack and you discard 1 card.'},
      {id:43,name:'Nickname',rarity:'common',enabled:true,desc:'Give yourself a grand nickname. Everyone must use it for the round.'},
      {id:44,name:'Slow Motion',rarity:'common',enabled:true,desc:'Play your whole turn in slow motion, narration optional.'},
      {id:45,name:'Mystery Card',rarity:'common',enabled:true,desc:'Draw your top card and play it without looking.'},
      {id:46,name:'Generous',rarity:'common',enabled:true,desc:'Give one card from your hand to the player of your choice, then draw normally.'},
      {id:47,name:'Quiet Bank',rarity:'common',enabled:true,desc:'You may not say any number until your next turn. Mime amounts instead.'},
      {id:48,name:'Salute',rarity:'common',enabled:true,desc:'Salute before each card you play this turn. Forget once and discard 1.'},
      {id:49,name:'Two Truths',rarity:'common',enabled:true,desc:'Tell the table one true fact about yourself, then take your turn.'},
      {id:50,name:'Left Hand Deal',rarity:'common',enabled:true,desc:'Hand out any payments this turn using only your non-dominant hand.'},
      {id:51,name:'Catchphrase',rarity:'common',enabled:true,desc:'Invent a catchphrase. Say it every turn until the end of the game.'},
      {id:52,name:'Rob the Bank',rarity:'common',enabled:true,desc:'Take the smallest money card from the player on your left.'},
      {id:53,name:'Lucky Draw',rarity:'common',enabled:true,desc:'Draw 1 extra card only if you can correctly guess a coin flip. Caller of your choice.'},
      {id:54,name:'Eyes Closed',rarity:'common',enabled:true,desc:'Draw your 2 cards with your eyes closed. You have 30 seconds.'},
      {id:55,name:'Toast Master',rarity:'common',enabled:true,desc:'Make a dramatic toast to the current leader before your turn.'},
      {id:56,name:'Swap a Card',rarity:'common',enabled:true,desc:'Trade one card blind with the player on your right, then take your turn.'},
      {id:57,name:'Karaoke',rarity:'uncommon',enabled:true,desc:'Sing a line from any song. If the table approves, steal a money card from anyone.'},
      {id:58,name:'Body Swap',rarity:'uncommon',enabled:true,desc:'Swap hands with the player on your left for one full turn, then swap back.'},
      {id:59,name:'Charades',rarity:'uncommon',enabled:true,desc:'Act out a film with no words. If anyone guesses it, draw 2 extra cards.'},
      {id:60,name:'Immunity Idol',rarity:'uncommon',enabled:true,desc:'Hold this. You may cancel the next card played against you this round.'},
      {id:61,name:'Robin Hood',rarity:'uncommon',enabled:true,desc:'Take a money card from the richest player and give it to the poorest.'},
      {id:62,name:'Mirror',rarity:'uncommon',enabled:true,desc:'Copy the last action card any player played this round and perform it yourself.'},
      {id:63,name:'Veto',rarity:'uncommon',enabled:true,desc:'Cancel any one action card the next player tries to play this turn.'},
      {id:64,name:'Memory Test',rarity:'uncommon',enabled:true,desc:'Name every player\'s property colours from memory. Get them all and steal one property.'},
      {id:65,name:'Tax Collector',rarity:'uncommon',enabled:true,desc:'Every player gives you their lowest value money card.'},
      {id:66,name:'Loud and Proud',rarity:'uncommon',enabled:true,desc:'Announce every card you play at full volume until your next turn, or discard 1.'},
      {id:67,name:'Mutiny',rarity:'rare',enabled:true,desc:'Every player passes one property to the player on their left.'},
      {id:68,name:'Great Heist',rarity:'rare',enabled:true,desc:'Steal 2 money cards from any single player.'},
      {id:69,name:'Time Freeze',rarity:'rare',enabled:true,desc:'Choose a player to skip their entire next turn.'},
      {id:70,name:'Property Tax',rarity:'rare',enabled:true,desc:'Every player with a full set gives you one card of your choice from their hand.'},
      {id:71,name:'Clone',rarity:'rare',enabled:true,desc:'Copy the effect of any action card played this game.'},
      {id:72,name:'Shuffle Up',rarity:'rare',enabled:true,desc:'Everyone passes their entire hand two players to the left.'},
      {id:73,name:'Golden Turn',rarity:'rare',enabled:true,desc:'Play unlimited cards this turn, but you cannot draw next turn.'},
      {id:74,name:'The Tax Man',rarity:'legendary',enabled:true,desc:'Collect one money card from every other player at the table.'},
      {id:75,name:'Total Recall',rarity:'legendary',enabled:true,desc:'Take back any one property anyone has stolen from you this game.'},
      {id:76,name:'Kingmaker',rarity:'legendary',enabled:true,desc:'Choose any player. They immediately complete one set of their choice from the draw pile, then shuffle the pile.'},
    ];

    this.WEIGHTS = {common:40,uncommon:35,rare:20,legendary:5};
    this.P_COLORS = ['#E74C3C','#3498DB','#2ECC71','#E67E22','#9B59B6','#1ABC9C'];
    this.TOKENS   = ['🎩','🚗','🐶','🚢','👢','🐱'];
    this.R_COLOR = {common:'#555',uncommon:'#003580',rare:'#C8952A',legendary:'#CC0000'};
    this.RARITY_TEXT = {common:'COMMON',uncommon:'UNCOMMON',rare:'★  RARE  ★',legendary:'✦  LEGENDARY  ✦'};

    this.S = {
      players:[
        {name:'',color:this.P_COLORS[0],missNext:false},
        {name:'',color:this.P_COLORS[1],missNext:false},
      ],
      idx:0,dir:1,turnCount:0,
      history:[],muted:false,
      revealed:false,lastCard:null,doubleTurn:false
    };

    this.cvs = document.getElementById('pcvs');
    this.pctx = this.cvs.getContext('2d');
    this.parts = [];
    this.praf = null;
    this.actx = null;

    this.renderSetup();
    this.setupEvents();
  }

  /* ── AUDIO ── */
  ac() {
    if (!this.actx) this.actx = new (window.AudioContext||window.webkitAudioContext)();
    if (this.actx.state==='suspended') this.actx.resume();
    return this.actx;
  }
  tone(freq,start,dur,type='sine',vol=0.28) {
    try {
      const c=this.ac(),o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(vol,start);
      g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
      o.start(start);o.stop(start+dur+0.01);
    } catch(e){}
  }
  playCard(rarity) {
    if (this.S.muted) return;
    try {
      const t=this.ac().currentTime;
      if (rarity==='common') {
        this.tone(440,t,0.12,'triangle',0.22);
        this.tone(554,t+0.1,0.12,'triangle',0.18);
      } else if (rarity==='uncommon') {
        this.tone(330,t,0.18,'sine',0.26);
        this.tone(440,t+0.14,0.18,'sine',0.24);
        this.tone(554,t+0.28,0.22,'sine',0.22);
      } else if (rarity==='rare') {
        [330,415,494,659].forEach((f,i)=>this.tone(f,t+i*0.09,0.45,'sine',0.22));
        this.tone(165,t,0.6,'sine',0.15);
      } else if (rarity==='legendary') {
        [261,329,392,523,659,784].forEach((f,i)=>{
          this.tone(f,t+i*0.09,0.65-i*0.04,'sine',0.24);
          this.tone(f*2,t+i*0.09,0.3,'triangle',0.08);
        });
        this.tone(65,t,1.8,'sawtooth',0.14);
        this.tone(130,t+0.6,0.9,'sine',0.10);
      }
    } catch(e){}
  }

  /* ── PARTICLES ── */
  burst(cx,cy) {
    this.cvs.width=innerWidth;this.cvs.height=innerHeight;
    this.cvs.style.display='block';
    const cols=['#CC0000','#FF6666','#C8952A','#F5D07A','#003580','#5580CC','#F2EDD7','#1A1A1A'];
    this.parts=Array.from({length:100},()=>{
      const a=Math.random()*Math.PI*2,sp=3+Math.random()*7.5;
      return {x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,
        life:1,dec:0.013+Math.random()*0.017,
        sz:3+Math.random()*6,col:cols[Math.random()*cols.length|0],
        rect:Math.random()>.5};
    });
    if (this.praf) cancelAnimationFrame(this.praf);
    this._anim();
  }
  _anim() {
    this.pctx.clearRect(0,0,this.cvs.width,this.cvs.height);
    this.parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.vx*=0.985;p.life-=p.dec;
      this.pctx.globalAlpha=Math.max(0,p.life);
      this.pctx.fillStyle=p.col;
      if (p.rect) this.pctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
      else{this.pctx.beginPath();this.pctx.arc(p.x,p.y,p.sz/2,0,Math.PI*2);this.pctx.fill();}
    });
    this.pctx.globalAlpha=1;
    this.parts=this.parts.filter(p=>p.life>0);
    if (this.parts.length) this.praf=requestAnimationFrame(()=>this._anim());
    else this.cvs.style.display='none';
  }

  /* ── CARD DRAW ── */
  drawCard() {
    const pool=this.CARDS.filter(c=>c.enabled);
    if (!pool.length) return null;
    const byR={};
    pool.forEach(c=>(byR[c.rarity]=byR[c.rarity]||[]).push(c));
    const entries=Object.keys(byR).map(r=>({r,cards:byR[r],w:this.WEIGHTS[r]||0}));
    const total=entries.reduce((s,e)=>s+e.w,0);
    if (!total) return pool[Math.random()*pool.length|0];
    let rnd=Math.random()*total;
    for (const e of entries){rnd-=e.w;if(rnd<=0) return e.cards[Math.random()*e.cards.length|0];}
    return pool[0];
  }

  /* ── GAME ── */
  curPlayer(){return this.S.players[this.S.idx];}
  advance() {
    const card=this.S.lastCard;
    if (card&&card.effect==='reverse') this.S.dir*=-1;
    if (card&&card.effect==='double_turn') this.S.doubleTurn=true;
    if (this.S.doubleTurn){this.S.doubleTurn=false;this.startTurn();return;}
    let next=(this.S.idx+this.S.dir+this.S.players.length)%this.S.players.length;
    const wrapped=this.S.dir===1?(next<this.S.idx):(next>this.S.idx);
    if (wrapped) this.S.turnCount+=this.S.players.length;
    if (this.S.players[next].missNext){
      this.S.players[next].missNext=false;
      next=(next+this.S.dir+this.S.players.length)%this.S.players.length;
    }
    this.S.idx=next;
    this.startTurn();
  }
  startTurn(){this.S.revealed=false;this.S.lastCard=null;this.renderGame();}

  /* ── RENDER ── */
  renderSetup() {
    const list=document.getElementById('players-list');
    list.innerHTML='';
    this.S.players.forEach((p,i)=>{
      const row=document.createElement('div');
      row.className='player-row';
      row.innerHTML=`
        <div class="player-swatch" style="background:${p.color};display:flex;align-items:center;justify-content:center;font-size:17px">${this.TOKENS[i]}</div>
        <input type="text" placeholder="Player ${i+1}" value="${p.name}" maxlength="12" data-i="${i}">
        ${this.S.players.length>2?`<button class="remove-btn" data-i="${i}">✕</button>`:''}
      `;
      list.appendChild(row);
    });
    list.querySelectorAll('input').forEach(el=>
      el.addEventListener('input',e=>this.S.players[+e.target.dataset.i].name=e.target.value)
    );
    list.querySelectorAll('.remove-btn').forEach(el=>
      el.addEventListener('click',e=>{this.S.players.splice(+e.target.dataset.i,1);this.renderSetup();})
    );
    document.getElementById('add-btn').style.display=this.S.players.length>=6?'none':'';
    document.getElementById('start-btn').disabled=this.S.players.length<2;
  }

  renderStrip() {
    const strip=document.getElementById('player-strip');
    strip.innerHTML='';
    this.S.players.forEach((p,i)=>{
      const el=document.createElement('div');
      el.className='p-chip';el.dataset.i=i;
      const isActive=i===this.S.idx;
      el.innerHTML=`
        <div class="p-avatar${isActive?' active':''}${p.missNext?' miss-flag':''}"
             style="background:${p.color};font-size:19px">${this.TOKENS[i]}</div>
        <div class="p-name${isActive?' active':''}">${p.name||`P${i+1}`}</div>
      `;
      strip.appendChild(el);
    });
    const active=strip.children[this.S.idx];
    if (active) setTimeout(()=>{
      const s=document.getElementById('player-strip');
      s.scrollLeft=active.offsetLeft-(s.offsetWidth/2)+(active.offsetWidth/2);
    },80);
  }

  renderCard() {
    const inner=document.getElementById('card-inner');
    const front=document.getElementById('c-front');
    const nextBtn=document.getElementById('next-btn');
    if (!this.S.revealed){
      inner.classList.add('no-anim');
      inner.classList.remove('flipped');
      requestAnimationFrame(()=>inner.classList.remove('no-anim'));
      front.className='c-face c-front';
      front.innerHTML='';
      nextBtn.classList.remove('show');
    } else {
      const c=this.S.lastCard,r=c.rarity;
      front.className=`c-face c-front r-${r}`;
      front.innerHTML=`
        <div class="c-header">
          <div class="c-rarity-label">${this.RARITY_TEXT[r]}</div>
        </div>
        <div class="c-body">
          <div class="c-name">${c.name}</div>
          <div class="c-divider-line"></div>
          <div class="c-desc">${c.desc}</div>
        </div>
      `;
      inner.classList.add('flipped');
      nextBtn.classList.add('show');
    }
  }

  renderGame() {
    const p=this.curPlayer();
    const name=p.name||`Player ${this.S.idx+1}`;
    const lbl=document.getElementById('turn-label');
    lbl.innerHTML=this.S.revealed
      ?`<strong style="color:${p.color}">${name}</strong> drew:`
      :`<strong style="color:${p.color}">${name}</strong> — tap to draw your bonus card`;
    const round=Math.floor(this.S.turnCount/this.S.players.length)+1;
    document.getElementById('round-label').textContent=`ROUND ${round}`;
    document.getElementById('dir-label').textContent=this.S.dir===1?'▶ CLOCKWISE':'◀ COUNTER-CLOCKWISE';
    this.renderStrip();
    this.renderCard();
  }

  renderHistory() {
    const strip=document.getElementById('history-strip');
    if (!this.S.history.length){strip.innerHTML='<span class="h-empty">NO CARDS DRAWN YET</span>';return;}
    strip.innerHTML='';
    [...this.S.history].reverse().slice(0,12).forEach(h=>{
      const el=document.createElement('div');
      el.className='h-item';
      el.innerHTML=`
        <div class="h-player" style="color:${h.pc}">${h.pn}</div>
        <div class="h-card">${h.cn}</div>
        <div class="h-dot" style="background:${this.R_COLOR[h.r]}"></div>
      `;
      strip.appendChild(el);
    });
  }

  renderEditor() {
    const body=document.getElementById('ed-body');
    body.innerHTML='';
    ['common','uncommon','rare','legendary'].forEach(r=>{
      const hdr=document.createElement('div');
      hdr.className='ed-section-hdr';hdr.textContent=r.toUpperCase();
      body.appendChild(hdr);
      this.CARDS.filter(c=>c.rarity===r).forEach(card=>{
        const row=document.createElement('div');
        row.className='ed-row';
        row.innerHTML=`
          <div class="ed-card-name">${card.name}</div>
          <select class="rarity-sel" data-id="${card.id}">
            ${['common','uncommon','rare','legendary'].map(rv=>
              `<option value="${rv}"${card.rarity===rv?' selected':''}>${rv}</option>`
            ).join('')}
          </select>
          <label class="toggle">
            <input type="checkbox"${card.enabled?' checked':''} data-id="${card.id}">
            <span class="tog-sl"></span>
          </label>
        `;
        body.appendChild(row);
      });
    });
    body.querySelectorAll('.rarity-sel').forEach(el=>
      el.addEventListener('change',e=>{
        const c=this.CARDS.find(c=>c.id===+e.target.dataset.id);
        if(c) c.rarity=e.target.value;
      })
    );
    body.querySelectorAll('.toggle input').forEach(el=>
      el.addEventListener('change',e=>{
        const c=this.CARDS.find(c=>c.id===+e.target.dataset.id);
        if(c) c.enabled=e.target.checked;
      })
    );
  }

  closeEditor(){document.getElementById('card-editor').classList.remove('open');}
  showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  setupEvents() {
    document.getElementById('add-btn').addEventListener('click',()=>{
      if(this.S.players.length>=6) return;
      this.S.players.push({name:'',color:this.P_COLORS[this.S.players.length],missNext:false});
      this.renderSetup();
    });

    document.getElementById('start-btn').addEventListener('click',()=>{
      this.S.players.forEach((p,i)=>{if(!p.name)p.name=`Player ${i+1}`;});
      this.S.idx=0;this.S.dir=1;this.S.turnCount=0;this.S.history=[];
      this.S.revealed=false;this.S.lastCard=null;this.S.doubleTurn=false;
      this.S.players.forEach(p=>p.missNext=false);
      this.showScreen('game');
      this.renderGame();
      this.renderHistory();
    });

    document.getElementById('card-wrap').addEventListener('click',()=>{
      if(this.S.revealed) return;
      const card=this.drawCard();
      if(!card) return;
      this.S.lastCard=card;this.S.revealed=true;
      const p=this.curPlayer();
      this.S.history.push({pn:p.name,pc:p.color,cn:card.name,r:card.rarity});
      this.renderGame();
      this.renderHistory();
      this.playCard(card.rarity);
      if(card.rarity==='legendary'){
        setTimeout(()=>{
          const rect=document.getElementById('card-wrap').getBoundingClientRect();
          this.burst(rect.left+rect.width/2,rect.top+rect.height/2);
        },480);
      }
    });

    document.getElementById('next-btn').addEventListener('click',()=>{
      this.advance();this.renderHistory();
    });

    document.getElementById('player-strip').addEventListener('click',e=>{
      const chip=e.target.closest('.p-chip');
      if(!chip) return;
      const i=+chip.dataset.i;
      if(i===this.S.idx) return;
      this.S.players[i].missNext=!this.S.players[i].missNext;
      this.renderStrip();
    });

    document.getElementById('mute-btn').addEventListener('click',()=>{
      this.S.muted=!this.S.muted;
      document.getElementById('mute-btn').textContent=this.S.muted?'🔇':'🔊';
    });

    document.getElementById('editor-btn').addEventListener('click',()=>{
      this.renderEditor();
      document.getElementById('card-editor').classList.add('open');
    });
    document.getElementById('ed-close').addEventListener('click',()=>this.closeEditor());
    document.getElementById('ed-backdrop').addEventListener('click',()=>this.closeEditor());
  }
}

document.addEventListener('DOMContentLoaded',()=>new Component());
</script>
